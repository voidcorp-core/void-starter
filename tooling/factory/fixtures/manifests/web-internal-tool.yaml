schema_version: 1

# Representative invite-only internal tool (DEV-474, ADR 63).
#
# The distinguishing field is `auth.access_mode: invite_only`, which makes the
# generated project refuse to create an account for any address that does not
# hold a pending invitation. The bootstrap administrator is the single
# exception, which is what makes the first account possible at all.
project:
  name: web-internal-tool
  profile: internal-tool

surfaces:
  web: next-vercel
  mobile:
    adapter: none
  worker: none

workloads:
  http: vercel-functions
  durable_jobs: none
  realtime_audio: none
  persistent_service: none

data:
  database: neon-eu
  orm: drizzle
  files: none

auth:
  provider: better-auth
  access_mode: invite_only
  passkeys: optional
  mfa: optional

operations:
  errors: sentry
  analytics: none
  email: resend

data_residency:
  policy: eu_primary
  personal_data: eu_required
  public_assets: global_allowed
  non_eu_processor:
    requires_approval: true
    requires_dpa: true
    requires_transfer_assessment: true

dns:
  provider: auto-detect

cost_policy:
  automatic_monthly_limit_eur: 10
  paid_upgrade_requires_approval: true
