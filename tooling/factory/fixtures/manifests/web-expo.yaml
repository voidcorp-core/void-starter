schema_version: 1

project:
  name: web-expo
  profile: saas

surfaces:
  web: next-vercel
  mobile:
    adapter: expo-eas
    ios_bundle_identifier: com.example.webexpo
    android_package: com.example.webexpo
  worker: none

workloads:
  http: vercel-functions
  durable_jobs: vercel-workflows
  realtime_audio: none
  persistent_service: none

data:
  database: neon-eu
  orm: drizzle
  files: cloudflare-r2-eu

auth:
  provider: better-auth
  access_mode: public_verified
  passkeys: optional
  mfa: optional

operations:
  errors: sentry
  analytics: posthog
  email: resend

data_residency:
  policy: eu_primary
  personal_data: eu_required
  public_assets: global_allowed
  non_eu_processor:
    requires_approval: true
    requires_dpa: true
    requires_transfer_assessment: true

dns:
  provider: auto-detect

cost_policy:
  automatic_monthly_limit_eur: 10
  paid_upgrade_requires_approval: true
