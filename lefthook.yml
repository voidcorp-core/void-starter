pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,jsx,tsx,json,jsonc,md}"
      run: bunx biome check --staged --no-errors-on-unmatched {staged_files}
    - name: type-check
      glob: "*.{ts,tsx}"
      run: bunx turbo run type-check --output-logs=errors-only
    - name: gitleaks
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --redact --no-banner
        else
          echo "WARN: gitleaks not installed, skipping secret scan"
        fi

pre-push:
  jobs:
    - name: knip
      run: bun run knip

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
