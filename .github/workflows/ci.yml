# CI uses a postgres service container (16-alpine) instead of a Neon CI branch.
# Rationale: CI tests verify schema migrations and queries, not connection pool
# behavior. Drift between docker postgres and Neon is negligible for these tests.
# Production and dev use Neon (DECISIONS entry 11).
#
# Speed contract (docs/CI.md#time-budget): pull requests run the affected Turbo
# graph from a cache seeded by `main`, browser tests run in shards alongside the
# code checks. Push, merge queue and manual runs prove the full graph.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: void
          POSTGRES_PASSWORD: void
          POSTGRES_DB: void_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U void -d void_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://void:void@localhost:5432/void_starter
      BETTER_AUTH_SECRET: test-secret-this-is-long-enough-for-the-validator
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-stub
      GOOGLE_CLIENT_SECRET: ci-stub
    steps:
      # Depth 2 fetches both parents of the pull request merge commit: the scope
      # plan compares against the first one, the base branch tip.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Vitest, Drizzle Kit, Playwright et al. ship binaries with `#!/usr/bin/env node`,
      # so cross-package `.ts` imports through them go through Node's loader. Node 24
      # ships `--experimental-strip-types` on by default (since 23.6), so `.ts` config
      # files imported across `package.json#exports` boundaries load natively without
      # any flag. Pinned for reproducibility; matches `engines.node` >= 24. See
      # DECISIONS entry 30.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      # Restored everywhere, saved from `main` pushes only (docs/CI.md#cache-strategy).
      # A main push restores the bun cache by exact key only, so a lockfile change
      # saves a fresh cache instead of carrying every older package forward.
      - name: Restore bun cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          # '' is falsy in expressions: it must be the `||` fallback, never the `&&` value.
          restore-keys: ${{ github.event_name != 'push' && format('{0}-bun-', runner.os) || '' }}
      - name: Restore Turbo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: bun test ./.github/scripts
      - id: scope
        run: node .github/scripts/ci-scope.mjs
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Apply DB migrations
        run: cd packages/db && bunx drizzle-kit migrate
      # One Turbo run, so independent tasks overlap. `build` skips Next's own type
      # check (apps/web/next.config.ts): `type-check` in this run is the type gate.
      - name: Type-check, test and build
        env:
          AFFECTED: ${{ steps.scope.outputs.affected }}
          TURBO_SCM_BASE: ${{ steps.scope.outputs.base }}
          TURBO_SCM_HEAD: HEAD
        run: |
          scope=()
          if [ "$AFFECTED" = true ]; then scope=(--affected); fi
          bunx turbo run type-check test build --summarize "${scope[@]}"
      - run: bun run knip
      - name: Prune Turbo cache to this tree
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node .github/scripts/ci-cache.mjs prune
      - name: Save Turbo cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
      - name: Save bun cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  # Browser tests run alongside `code`: each shard starts its own database and
  # dev server and uses no `code` output. Add a number to split the suite
  # further; `strategy.job-total` follows.
  e2e-shard:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: void
          POSTGRES_PASSWORD: void
          POSTGRES_DB: void_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U void -d void_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://void:void@localhost:5432/void_starter
      BETTER_AUTH_SECRET: test-secret-this-is-long-enough-for-the-validator
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-stub
      GOOGLE_CLIENT_SECRET: ci-stub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Restore bun cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: cd packages/db && bunx drizzle-kit migrate
      - run: cd apps/web && bunx playwright install --with-deps chromium
      - run: cd apps/web && bun run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run audit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Verify the release asset before extraction or execution. Digest from
      # https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v8.30.1
      - name: Install verified gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose'

  # Keep the existing required check name while collecting independent results.
  # always() ensures an upstream failure/skip cannot turn this gate into a skip.
  quality:
    if: ${{ always() }}
    needs: [code, dependency-audit, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Admit integration validation
        run: node .github/scripts/ci-admission.mjs
      - name: Require every quality check
        env:
          CODE_RESULT: ${{ needs.code.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$CODE_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$SECRETS_RESULT" = success

  # Keep the existing required check name over the shards. always() ensures a
  # failed, cancelled or skipped shard cannot turn this gate into a skip.
  e2e:
    if: ${{ always() }}
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Admit integration validation
        run: node .github/scripts/ci-admission.mjs
      - name: Require every browser shard
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARDS_RESULT" = success
      # One HTML report across the failed shards (Playwright merge-reports).
      - if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        run: bun install --frozen-lockfile --ignore-scripts
      - if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        run: cd apps/web && bunx playwright merge-reports --reporter html ./all-blob-reports
      - if: ${{ failure() && needs.e2e-shard.result == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
